name: Atualizar imóveis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/coleta-seeds.json'
      - '.github/workflows/atualizar-imoveis.yml'
  schedule:
    - cron: '15 10 * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-imoveis
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar páginas públicas verificadas
        run: python scripts/collect_public_pages.py
      - name: Atualizar inventário, elegibilidade e Match
        run: python scripts/update_inventory.py --input data/coleta-atual.json
      - name: Validar dados e testes
        run: |
          python -m json.tool data/imoveis.json >/dev/null
          python -m json.tool data/status-coleta.json >/dev/null
          python -m unittest discover -s tests -v
      - name: Resumo da coleta
        run: |
          python - <<'PY'
          import json, os
          s=json.load(open('data/status-coleta.json', encoding='utf-8'))
          text=(f"### Coleta de imóveis\n"
                f"- Estado: **{s['estado']}**\n"
                f"- Coletados: **{s['coletados']}**\n"
                f"- Erros: **{s['erros']}**\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f: f.write(text)
          PY
      - name: Commit de atualização
        run: |
          if git diff --quiet -- data/imoveis.json data/coleta-atual.json data/status-coleta.json; then
            echo 'Sem alterações de imóveis ou status.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/imoveis.json data/coleta-atual.json data/status-coleta.json
          git commit -m 'data: atualiza imóveis e saúde da coleta'
          git push
