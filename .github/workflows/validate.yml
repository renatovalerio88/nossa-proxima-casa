name: Validar Nossa Próxima Casa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar JSON
        run: |
          python -m json.tool data/config.json >/dev/null
          python -m json.tool data/imoveis.json >/dev/null
          python -m json.tool data/fontes.json >/dev/null
          python -m json.tool data/status-coleta.json >/dev/null
      - name: Validar qualidade dos dados
        run: python scripts/validate_data_quality.py
      - name: Rodar testes
        run: python -m unittest discover -s tests -v
